<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style_05.css">
</head>
<body>
    <div class="container-fluid   bg-blue">
        <div class="container">
            <div class="rows">
                <div class="col-12">
                    <p class="text-white">New Employee</p>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid">
        <div class="container">
            <div class="rows">
                <div class="col-6">
                    <label for="name">
                        <p class="m-0">Name</p>
                    </label>
                    <input id="name" type="text" class="form-control">
                </div>
                <div class="col-6">
                    <label for="email">
                        <p class="m-0">Email</p>
                    </label>
                    <input id="email" type="email" class="form-control">
                </div>
            </div>

            <div class="rows ">
                <div class="col-6">
                    <label for="phone">
                        <p class="m-0">Phone</p>
                    </label>
                    <input id="phone" type="tel" class="form-control">
                </div>
                <div class="col-6">
                    <label for="postion">
                        <p class="m-0">Postion</p>
                    </label>
                    <select name="postion" id="postion" class="form-control">
                        <option value="">--Select Postion--</option>
                        <option value="staff">Staff</option>
                        <option value="manager">Manager</option>
                        <option value="ceo">CEO</option>
                    </select>
                </div>
                
            </div>

            <div class="rows bor-bottom">
                <div class="col-12">
                    <p>Sex</p>
                    <div class="justify-between">
                        <label for="male">
                            <input type="radio" id="male">Male
                        </label>
                        <label for="female">
                            <input type="radio" id="female">Female
                        </label>
                    </div>
                </div>

            </div>
            <div class="d-flex justify-right">
                <button class="save m-2">Save</button>
                <button class="cancel m-2">Cancel</button>
            </div>
        </div>
    </div>

</body>
</html>
