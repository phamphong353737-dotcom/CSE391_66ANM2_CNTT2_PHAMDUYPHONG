<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 1</title>
    <link rel="stylesheet" href="./assets/bai1.css">
    <link rel="stylesheet" href="./assets/flex.css">
</head>
<body>
    <div class="container-fluid">
        <div class="container">
            <div class="rows">
                <div class="col-12">
                    <h3>Get in touch with us by filling contact form below</h3>
                </div>
                <div class="col-6">
                    <input type="text" placeholder="*Enter your full name" class="form">
                </div>
                <div class="col-6">
                    <input type="text" placeholder="*Enter your email address" class="form">
                </div>
                <div class="col-12">
                    <input type="text" placeholder="Enter your subject" class="form">
                </div>
                <div class="col-12">
                    <textarea placeholder="Your message here..." rows="6" class="form"></textarea>
                </div>
            </div>
            <div class="d-flex justify-between items-center">
                <button class="bg-primary text-white font-bold">
                    <span>Send message</span>
                </button>
                <span>*Please fill all required form field, thanks!</span>
            </div>
        </div>
    </div>
</body>
</html>
